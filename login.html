<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de chamados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div style="text-align: center;">

    <h1>Login</h1>
    
    <div id="divDados">

    <input type="email" id="email" placeholder="Digite seu email"> <br>    
    <input type="password" id="senha" placeholder="Digite seu senha"> <br>
    </div>
    
    <button class="button" onclick="logarResponsavel()">Logar</button>
    
    </div>
        
    <br>

    <br>
    
    <div id="listar-responsavel"></div>

    

    <script>

        async function logarResponsavel(){

            const senha = document.getElementById('senha').value;
            const email = document.getElementById('email').value;

            
            if (!senha || !email){
                alert ("Preencha todas as informações!")
                return
            } else {
            const resposta = await fetch('http://localhost:3000/login', {
                method: "POST",
                body: JSON.stringify({senha, email}),
                headers: {"Content-Type": "application/json"}
            })
            const dados = await resposta.json();
            if (resposta.ok) {
                localStorage.setItem('responsavelId', dados.usuario.id_responsavel);
                window.location.href = "chamados.html"
            } else {
                alert("Erro no Login")
            }
            } 

        }

        </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
